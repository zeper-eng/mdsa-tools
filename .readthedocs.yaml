# .readthedocs.yaml
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    # Install your package so autodoc can import it
    - method: pip
      path: .
    # Install doc-only requirements (themes, extensions)
    - requirements: docs/requirements.txt

