# .readthedocs.yaml
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  # change if your conf.py lives elsewhere
  configuration: docs/source/conf.py

python:
  install:
    # Install doc-only requirements (themes, etc.)
    - requirements: docs/requirements.txt
    # Install your package so autodoc can import it (we’ll mock heavy deps)
    - method: pip
      path: .

