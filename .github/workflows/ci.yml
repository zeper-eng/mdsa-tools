name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install build tool
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Install built wheel (simulate PyPI install)
        run: pip install dist/*.whl

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run tests
        run: pytest -v --cov=mdsa_tools --cov-report=term-missing --cov-fail-under=75
