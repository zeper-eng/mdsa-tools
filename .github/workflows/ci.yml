name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # ← match this locally or bump both to 3.13
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package + test deps
        run: pip install -e .[test]
      - name: Run tests
        run: pytest -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install -U pip
      # pick ONE of the two install approaches:
      - name: Install docs deps (extras)
        run: pip install -e .[docs]
      # OR if you prefer a file:
      # - name: Install docs deps (requirements.txt)
      #   run: pip install -r docs/requirements.txt && pip install -e .
      - name: Build docs
        run: sphinx-build -b html docs/source docs/_build/html

