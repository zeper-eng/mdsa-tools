name: Docs

on:
  push:
    branches: [ main ]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show conf + requirements
        run: |
          ls -la
          ls -la docs
          ls -la docs/source
          cat docs/requirements.txt

      - name: Install docs deps (same env)
        run: |
          python -m pip install -U pip
          python -m pip install -r docs/requirements.txt
          # if you use autodoc/import your package:
          python -m pip install -e .

      - name: Sanity check imports (same env)
        run: |
          python -c "import nbsphinx, myst_parser, sphinx; print('OK:', nbsphinx.__version__, sphinx.__version__)"

      - name: Build Sphinx HTML (same env)
        run: |
          python -m sphinx -b html docs/source docs/_build/html

