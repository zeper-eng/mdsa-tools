name: Docs

on:
  push:
    branches: [ main ]

# (Optional) you can also put permissions at the workflow level:
# permissions:
#   contents: read
#   pages: write
#   id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs deps
        run: |
          python -m pip install -U pip
          pip install -r docs/requirements.txt
          pip install -e .  # if using autodoc

      - name: Build Sphinx HTML
        run: sphinx-build -b html docs/source docs/_build/html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sanity check artifact
        run: ls -R docs/_build/html | head -n 200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

