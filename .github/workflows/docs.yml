name: Docs

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and docs deps
        run: |
          python -m pip install -U pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build Sphinx HTML (warnings fail build)
        run: |
          sphinx-build -E -b html docs/source docs/_build/html -W --keep-going

      - name: Upload HTML as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

