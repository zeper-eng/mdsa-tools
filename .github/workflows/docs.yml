name: Docs
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install your package and doc deps (either A or B)

      # A) If you have docs/requirements.txt (recommended):
      - name: Install deps
        run: |
          pip install -e .
          pip install -r docs/requirements.txt

      # B) OR inline (delete the A block above and use this instead):
      # - name: Install deps
      #   run: |
      #     pip install -e .
      #     pip install sphinx sphinx-autodoc-typehints myst-parser nbsphinx

      - name: Build Sphinx
        run: sphinx-build -b html docs/source docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

